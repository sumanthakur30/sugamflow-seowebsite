name: public-seo

on:
  push:
  pull_request:

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check committed public SEO files
        run: node tools/check-public-seo.mjs
